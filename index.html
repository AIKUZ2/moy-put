<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Карточки по 40 билетам, тренажёр диагностики и план на 6 недель к экзамену по эндодонтии"><meta name="theme-color" content="#F5F5F3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Эндо-тренер"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Эндо-тренер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Макет: колонка-«телефон» до 480px, плавающее меню-таблетка внизу.
   Строгая графитовая палитра, как у методички: тёплый белый фон, графитовый текст, один тёмно-синий акцент;
   разделы — оттенки одной холодной гаммы. Переменные --violet* исторически названы так, это акцент. */
:root{
  --bg:#F5F5F3;
  --surface:rgba(255,255,255,.92); --surface-solid:#FFFFFF; --line:rgba(30,34,38,.09);
  --fg:#1E2226; --muted:#68707C;
  --violet:#2C4A7A; --violet-2:#3F5F92; --violet-tint:rgba(44,74,122,.09); --on-violet:#FFFFFF;
  --ink:#1E2226; --on-ink:#FFFFFF;
  --good:#2F7D5B; --bad:#B4424F; --good-tint:rgba(47,125,91,.11); --bad-tint:rgba(180,66,79,.09);
  --tooth:#FFFFFF; --blush:#E8B7C2;
  --s1:#E4EAF3; --s2:#E2EDF1; --s3:#E8E8F3; --s4:#ECECF0; --s5:#E1EEEB; --s6:#E5ECF5; --s7:#E0EFF1; --s8:#E9ECF1;
  --s1i:#2C4A7A; --s2i:#2B6177; --s3i:#4A4F8C; --s4i:#585D72; --s5i:#2D6B63; --s6i:#3D6290; --s7i:#2E7381; --s8i:#49556B;
  --shadow:0 6px 22px rgba(20,30,50,.07);
  --f-main:'Philosopher','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B;
    --surface:rgba(31,35,41,.92); --surface-solid:#1F2329; --line:rgba(255,255,255,.09);
    --fg:#E8EAED; --muted:#9AA2AE;
    --violet:#8FB0E6; --violet-2:#A9C2EC; --violet-tint:rgba(143,176,230,.15); --on-violet:#12161C;
    --ink:#E8EAED; --on-ink:#15171B;
    --good:#6FCB9F; --bad:#EE8A94; --good-tint:rgba(111,203,159,.15); --bad-tint:rgba(238,138,148,.14);
    --tooth:#F1ECE2; --blush:#B97C8E;
    --s1:#222C3B; --s2:#1F2E35; --s3:#272841; --s4:#2A2B33; --s5:#1E302C; --s6:#223047; --s7:#1D3036; --s8:#262B34;
    --s1i:#9DB8E3; --s2i:#8CC3D6; --s3i:#ABAEE6; --s4i:#B3B7C8; --s5i:#8ACFC3; --s6i:#A3C0EA; --s7i:#86CCD8; --s8i:#AEB9CC;
    --shadow:0 10px 30px rgba(0,0,0,.40);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171B;
  --surface:rgba(31,35,41,.92); --surface-solid:#1F2329; --line:rgba(255,255,255,.09);
  --fg:#E8EAED; --muted:#9AA2AE;
  --violet:#8FB0E6; --violet-2:#A9C2EC; --violet-tint:rgba(143,176,230,.15); --on-violet:#12161C;
  --ink:#E8EAED; --on-ink:#15171B;
  --good:#6FCB9F; --bad:#EE8A94; --good-tint:rgba(111,203,159,.15); --bad-tint:rgba(238,138,148,.14);
  --tooth:#F1ECE2; --blush:#B97C8E;
  --s1:#222C3B; --s2:#1F2E35; --s3:#272841; --s4:#2A2B33; --s5:#1E302C; --s6:#223047; --s7:#1D3036; --s8:#262B34;
  --s1i:#9DB8E3; --s2i:#8CC3D6; --s3i:#ABAEE6; --s4i:#B3B7C8; --s5i:#8ACFC3; --s6i:#A3C0EA; --s7i:#86CCD8; --s8i:#AEB9CC;
  --shadow:0 10px 30px rgba(0,0,0,.40);
  color-scheme:dark;
}
body{
  background-color:var(--bg); color:var(--fg);
  font-family:var(--f-main); font-size:16.5px; line-height:1.42;
  padding-inline:16px; padding-block:0 calc(118px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
body.lock{ overflow:hidden; }
*{ box-sizing:border-box; }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:16px; padding-top:16px; }
.ic{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block; }
.ic.f{ fill:currentColor; stroke:none; }
.muted{ color:var(--muted); }
.small{ font-size:14px; }

/* Верхняя панель */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; }
.topbar.center .bar-title{ position:absolute; left:50%; transform:translateX(-50%); }
.topbar.center{ position:relative; }
.bar-title{ margin:0; font-size:19px; font-weight:700; }
.who{ display:flex; align-items:center; gap:10px; min-width:0; }
.who-name{ font-weight:700; font-size:17px; }
.ava{ width:48px; height:48px; border-radius:50%; background:var(--surface-solid); display:grid; place-items:center; box-shadow:var(--shadow); flex:none; }
.ava.sm{ width:42px; height:42px; }
.ava.initial{ background:var(--violet); color:var(--on-violet); font-weight:700; font-size:21px; }
.ava.logo{ background:var(--violet-tint); color:var(--violet); box-shadow:none; }
.ava .ic{ width:22px; height:22px; }
.round{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--surface-solid); display:grid; place-items:center; box-shadow:var(--shadow); flex:none; color:var(--fg); }
.headline{ font-size:clamp(29px,8vw,34px); font-weight:700; line-height:1.12; margin:0; letter-spacing:-.005em; text-wrap:balance; }
.sub{ margin:-6px 0 0; color:var(--muted); }

/* Кнопки */
.pill-btn{ border:0; border-radius:999px; padding:11px 18px; font-weight:700; font-size:15.5px; }
.pill-btn.violet{ background:var(--violet); color:var(--on-violet); box-shadow:0 6px 16px rgba(20,30,50,.16); }
.pill-btn.grey{ background:var(--line); color:var(--fg); }
.pill-btn.wide{ width:100%; }
.ink-btn{ width:100%; border:0; border-radius:999px; padding:15px 20px; background:var(--ink); color:var(--on-ink); font-weight:700; font-size:16.5px; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:var(--shadow); }
.ichip{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--violet-tint); color:var(--violet); flex:none; }
.ichip.w{ background:rgba(255,255,255,.65); color:var(--fg); }

/* Плитки на «Сегодня» */
.wrap > *{ min-width:0; }
.feat{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:12px; }
.tile{ background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:16px; box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:flex; flex-direction:column; gap:8px; min-width:0; text-align:left; }
.tile.big{ grid-row:span 2; justify-content:space-between; }
.tile h3{ margin:0; font-size:19px; line-height:1.2; }
.tile p{ margin:0; }
.tile-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.tile .go{ color:var(--muted); }
.col{ display:flex; flex-direction:column; gap:12px; min-width:0; }

.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.sec-head h2{ margin:0; font-size:20px; }
.sec-head a, .sec-head button{ background:none; border:0; color:var(--muted); font-size:14.5px; padding:0; }

/* Карточки билетов на «Сегодня» */
.topics{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.topic{ background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; min-width:0; }
.topic-num{ font-size:13.5px; font-weight:700; }
.topic h4{ margin:0; font-size:16.5px; line-height:1.22; }
.clamp{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.topic .pill-btn{ margin-top:auto; padding:9px 14px; font-size:14.5px; }

/* Полоса недель / дней */
.strip{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; }
.dpill{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0; border-radius:16px; border:1.5px solid transparent; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.dpill b{ font-size:17px; color:var(--fg); }
.dpill.past{ background:var(--violet-tint); }
.dpill.now{ border-color:var(--violet); background:var(--surface-solid); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:16px; box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:flex; flex-direction:column; gap:12px; min-width:0; }
.card h3{ margin:0; font-size:18px; }
.label{ font-size:14px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:7px; }
.dot{ width:9px; height:9px; border-radius:50%; flex:none; }

/* Поиск и чипы */
.search{ display:flex; gap:10px; align-items:center; }
.search-box{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:var(--surface-solid); border:1px solid var(--line); border-radius:999px; padding:0 16px; box-shadow:var(--shadow); color:var(--muted); }
.search-box input{ flex:1; min-width:0; border:0; background:none; padding:13px 0; outline:none; color:var(--fg); }
.sq{ width:48px; height:48px; border-radius:50%; border:0; display:grid; place-items:center; background:var(--violet); color:var(--on-violet); box-shadow:0 6px 16px rgba(20,30,50,.16); flex:none; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; border:1px solid var(--line); background:var(--surface-solid); border-radius:999px; padding:8px 16px; font-size:15px; white-space:nowrap; }
.chip[aria-pressed="true"]{ background:var(--violet); color:var(--on-violet); border-color:transparent; }

/* Плитки билетов */
.tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.ntile{ border:0; border-radius:24px; padding:14px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0; color:var(--fg); box-shadow:var(--shadow); }
.nt-head{ display:flex; align-items:center; gap:8px; }
.nt-label{ font-weight:700; font-size:14px; }
.nt-title{ font-weight:700; font-size:16px; line-height:1.22; }
.nt-meta{ font-size:13.5px; color:var(--muted); }
.nt-go{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:14.5px; padding-top:4px; }
.pill{ border-radius:999px; padding:1px 9px; font-size:12.5px; font-weight:700; display:inline-block; }
.pill.new{ background:rgba(255,255,255,.6); color:var(--muted); }
.pill.learn{ background:var(--bad-tint); color:var(--bad); }
.pill.rep{ background:var(--violet-tint); color:var(--violet); }
.pill.ok{ background:var(--good-tint); color:var(--good); }
.sticky{ position:sticky; bottom:calc(98px + env(safe-area-inset-bottom,0px)); z-index:10; }
.empty{ text-align:center; padding:24px 8px; grid-column:1/-1; }

/* Тренажёр-чат */
.chat{ display:flex; flex-direction:column; gap:12px; }
.msg{ display:flex; gap:10px; align-items:flex-start; }
.msg.me{ justify-content:flex-end; }
.bot-ava{ width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--violet); color:var(--on-violet); }
.bot-ava.ghost{ visibility:hidden; }
.bubble{ background:var(--surface-solid); border:1px solid var(--line); border-radius:6px 22px 22px 22px; padding:12px 14px; box-shadow:var(--shadow); min-width:0; max-width:86%; }
.msg.me .bubble{ background:var(--ink); color:var(--on-ink); border-color:transparent; border-radius:22px 6px 22px 22px; }
.bubble h4{ margin:0 0 8px; font-size:16.5px; }
.bubble p{ margin:0; }
.bubble dl{ margin:0; display:grid; grid-template-columns:minmax(88px,auto) 1fr; gap:7px 12px; }
.bubble dt{ color:var(--muted); font-size:14px; }
.bubble dd{ margin:0; }
.choices{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.choice{ border:1.5px solid var(--violet-tint); background:var(--surface-solid); border-radius:999px; padding:10px 16px; text-align:right; max-width:90%; box-shadow:var(--shadow); }
.choice:hover{ border-color:var(--violet); }
.verdict-ok{ color:var(--good); }
.verdict-no{ color:var(--bad); }
.composer{ position:sticky; bottom:calc(98px + env(safe-area-inset-bottom,0px)); z-index:10; display:flex; gap:10px; align-items:center; }
.composer .fake{ flex:1; min-width:0; background:var(--surface-solid); border:1px solid var(--line); border-radius:999px; padding:13px 18px; color:var(--muted); box-shadow:var(--shadow); text-align:left; }
.composer .fake.on{ color:var(--fg); }
.score{ align-self:center; background:var(--surface-solid); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }

/* Прогресс */
.profile{ align-items:center; text-align:center; }
.ava-big{ width:96px; height:96px; border-radius:50%; background:var(--violet); color:var(--on-violet); font-size:42px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 5px var(--violet-tint), var(--shadow); }
.ava-big .ic{ width:40px; height:40px; }
.pname{ font-size:22px; font-weight:700; margin:0; }
.big{ font-size:34px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
.stack{ display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--line); }
.stack span{ display:block; height:100%; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; color:var(--muted); }
.legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
.two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.nt-title, .topic h4, .tile h3{ overflow-wrap:anywhere; hyphens:auto; }
.secrows{ display:flex; flex-direction:column; gap:10px; }
.secrow{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:15px; }
.secrow .bar{ grid-column:1/-1; height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
.secrow .bar span{ display:block; height:100%; border-radius:99px; }
.mini{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.mini li{ display:flex; gap:10px; }
.mini .num{ font-weight:700; color:var(--muted); min-width:28px; font-variant-numeric:tabular-nums; }
.list{ display:flex; flex-direction:column; }
.lrow{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; }
.lrow:last-child{ border-bottom:0; }
.lrow .grow{ flex:1; min-width:0; }
.lrow input[type="date"], .lrow input[type="text"]{ border:1px solid var(--line); background:var(--surface-solid); border-radius:12px; padding:6px 8px; max-width:150px; }
.note{ font-size:14px; color:var(--muted); margin:0; padding:0 2px 8px; }
.steps{ margin:0 0 6px; padding-left:20px; font-size:14.5px; display:flex; flex-direction:column; gap:4px; }
.row-btns{ display:flex; gap:10px; }
.row-btns .pill-btn{ flex:1; }
.pill-btn.bad{ background:var(--bad-tint); color:var(--bad); }

/* Меню-таблетка */
.tabbar{ position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; justify-content:center; pointer-events:none; padding:0 16px; }
.tabbar-in{ pointer-events:auto; display:flex; align-items:center; gap:4px; background:var(--surface); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:999px; padding:7px; box-shadow:0 12px 30px rgba(20,30,50,.14); }
.tab{ width:50px; height:50px; border-radius:50%; border:0; background:none; display:grid; place-items:center; color:var(--muted); }
.tab[aria-current="page"]{ background:var(--violet); color:var(--on-violet); }
.fab{ width:62px; height:62px; margin:-22px 6px 0; border-radius:50%; border:5px solid var(--bg); background:var(--violet); color:var(--on-violet); display:grid; place-items:center; box-shadow:0 10px 24px rgba(20,30,50,.24); }
.fab .ic{ width:26px; height:26px; }

/* Карточка билета */
.study{ position:fixed; inset:0; z-index:50; overflow-y:auto; background-color:var(--bg);
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px)); }
.study-in{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-height:100%; }
.prog{ height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
.prog span{ display:block; height:100%; background:var(--violet); border-radius:99px; transition:width .25s; }
.center{ text-align:center; }
/* Медальон билета: номер на цвете раздела, по краю кольцо прогресса */
.medal-wrap{ display:grid; place-items:center; padding:16px 0 4px; }
.medal{ position:relative; width:min(56vw,220px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.medal .ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.medal .ring circle{ transition:stroke-dashoffset .35s ease-out; }
.medal-in{ width:74%; aspect-ratio:1; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }
.medal-cap{ font-size:15px; font-weight:700; letter-spacing:.04em; }
.medal-num{ font-size:clamp(52px,16vw,66px); font-weight:700; line-height:1; color:var(--fg); font-variant-numeric:tabular-nums; }
.medal-in .ic{ width:56px; height:56px; stroke-width:2.2; }
.listen{ text-align:center; margin:0; }
.q{ margin:0; text-align:center; font-size:clamp(25px,7vw,30px); line-height:1.2; font-weight:700; text-wrap:balance; }
.q .soft{ color:var(--muted); font-weight:400; }
.q.sm{ font-size:22px; }
.answer ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:9px; animation:rise .25s ease-out; }
.answer b{ font-weight:700; }
.controls{ margin-top:auto; display:flex; justify-content:center; align-items:flex-start; gap:30px; padding-top:10px; }
.ctl{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13.5px; color:var(--muted); background:none; border:0; padding:0; }
.ctl .c{ width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:var(--surface-solid); border:1px solid var(--line); color:var(--fg); box-shadow:var(--shadow); }
.ctl.main .c{ width:70px; height:70px; background:var(--violet); color:var(--on-violet); border:0; box-shadow:0 10px 24px rgba(20,30,50,.24); }
.ctl.main .c .ic{ width:28px; height:28px; }
.ctl.main{ color:var(--fg); font-weight:700; }
.ctl.ghost{ visibility:hidden; }
@keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .medal .ring circle{ transition:none; } .answer ul{ animation:none; } .prog span{ transition:none; } }
@media (max-width:360px){ .feat{ grid-template-columns:1fr; } .tile.big{ grid-row:auto; } }
</style>
</head>
<body>

<main class="wrap" id="main"></main>
<nav class="tabbar" aria-label="Разделы приложения">
  <div class="tabbar-in" id="tabbar"></div>
</nav>
<div class="study" id="study" hidden role="dialog" aria-label="Карточка билета"></div>

<script>

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return {y,m,d}; }
function toDate(s){ const p = parse(s); return new Date(p.y, p.m-1, p.d); }
function addDays(s,n){ const p = parse(s); return iso(new Date(p.y, p.m-1, p.d+n)); }
function daysBetween(a,b){ const A = parse(a), B = parse(b); return Math.round((Date.UTC(B.y,B.m-1,B.d) - Date.UTC(A.y,A.m-1,A.d)) / 864e5); }
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function human(s){ const p = parse(s); return p.d+' '+MONTHS[p.m-1]; }
function pl(n, f){ n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; }
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function chunks(arr, k){ const out = [], base = Math.floor(arr.length/k), extra = arr.length % k; let p = 0; for (let i = 0; i < k; i++){ const size = base + (i < extra ? 1 : 0); out.push(arr.slice(p, p+size)); p += size; } return out; }
function point(p){ return esc(p).replace(/^([^:]{2,34}):/, '<b>$1:</b>'); }
function greet(){ const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 17 ? 'Добрый день' : h < 23 ? 'Добрый вечер' : 'Доброй ночи'; }

const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
function load(){ try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && s.v === 1) return Object.assign(defaultState(), s); } catch(e){} return defaultState(); }
let state = load();
let remote = null, saveTimer = null, saving = false, pending = false, syncMode = 'local';

function commit(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
  if (remote){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
}
async function flush(){
  if (!remote) return;
  if (saving){ pending = true; return; }
  saving = true;
  try { await remote.set(JSON.parse(JSON.stringify(state))); syncMode = 'cloud'; }
  catch(e){
    if (e && e.code === 'unavailable'){ setTimeout(flush, 1500 + Math.random()*1500); }
    else { remote = null; syncMode = 'local'; }
  } finally {
    saving = false;
    if (pending){ pending = false; flush(); }
    updateSyncLabel();
  }
}

    const ref = db.doc('data/users/' + id + '/progress');
    let first = true;
    ref.onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (d && (d.updatedAt || 0) > (state.updatedAt || 0)){
        state = Object.assign(defaultState(), JSON.parse(JSON.stringify(d)));
        try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
        render();
      }
      if (first){
        first = false; remote = ref; syncMode = 'cloud';
        if (state.updatedAt && (!d || (d.updatedAt || 0) < state.updatedAt)){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
        updateSyncLabel();
      }
    }, () => { remote = null; syncMode = 'local'; updateSyncLabel(); });
  } catch(e){}
}
function updateSyncLabel(){
  const el = document.getElementById('sync');
  if (!el) return;
  el.textContent = syncMode === 'cloud'
    ? 'Прогресс хранится в аккаунте claude.ai — одинаковый на телефоне и компьютере'
    : IN_CLAUDE
      ? 'Прогресс хранится только на этом устройстве. Войди в claude.ai, чтобы он сохранялся в аккаунте'
      : 'Прогресс хранится в браузере на этом устройстве. Не очищай данные сайта, иначе он сотрётся';
}

/* ---------- Логика плана и карточек ---------- */
function card(n){ return state.cards[n] || {b:0, due:'', seen:0}; }
function status(n){ const c = state.cards[n]; if (!c || !c.seen) return ['new','Новый']; if (c.b === 0) return ['learn','Учу']; if (c.b < 3) return ['rep','Повторяю']; return ['ok','Знаю']; }
function countKnown(){ return ALL.filter(n => card(n).b >= 3).length; }
function dueList(t){ return ALL.filter(n => { const c = state.cards[n]; return c && c.seen && c.due && c.due <= t; }).sort((a,b) => card(a).due.localeCompare(card(b).due)); }
function grade(n, ok){
  const c = Object.assign({}, card(n));
  c.seen = (c.seen || 0) + 1;
  if (ok){ c.b = Math.min((c.b || 0) + 1, 5); c.due = addDays(today(), [0,1,3,7,14,30][c.b]); }
  else { c.b = 0; c.due = today(); }
  state.cards[n] = c;
}
function markActive(){ const t = today(); if (!state.days.includes(t)){ state.days.push(t); state.days = state.days.slice(-150); } }
function streak(){
  const set = new Set(state.days); let d = today(), s = 0;
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)){ s++; d = addDays(d, -1); }
  return s;
}
function weakTickets(){ const w = ALL.filter(n => card(n).b <= 1); return w.length ? w : dueList(today()); }
function dayInfo(t){
  const idx = daysBetween(START, t);
  if (idx < 0) return {kind:'before', week:-1, wait:-idx, tickets:chunks(WEEKS[0].n,5)[0]};
  const week = Math.floor(idx/7), dow = idx % 7;
  if (week >= 6) return {kind:'after', week:6, tickets:weakTickets()};
  if (dow < 5) return {kind: week === 5 ? 'final' : 'study', week, day:dow, tickets:chunks(WEEKS[week].n,5)[dow]};
  if (dow === 5) return {kind:'review', week, tickets: week === 5 ? weakTickets() : WEEKS[week].n.slice()};
  return {kind:'rest', week, tickets:[]};
}

/* ---------- Экран «Тренажёр» ---------- */
function newCase(){
  const rows = DX[dxSet].rows;
  let i;
  do { i = Math.floor(Math.random()*rows.length); } while (rows.length > 1 && dxCase && dxCase.set === dxSet && i === dxCase.i);
  let pool = rows.map((r,j) => j).filter(j => j !== i);
  if (dxSet === 'pulp'){ pool.sort((a,b) => Math.abs(a-i) - Math.abs(b-i)); pool = pool.slice(0,5); }
  shuffle(pool);
  dxCase = {set:dxSet, i, opts:shuffle([i].concat(pool.slice(0,3))), picked:null};
}
function trainerView(){
  if (!dxCase || dxCase.set !== dxSet) newCase();
  const set = DX[dxSet], row = set.rows[dxCase.i];
  const chips = Object.keys(DX).map(k => '<button class="chip" data-act="dx-set" data-set="'+k+'" aria-pressed="'+(dxSet===k)+'">'+esc(DX[k].name)+'</button>').join('');
  const facts = set.labels.map((l,j) => '<dt>'+esc(l)+'</dt><dd>'+esc(row[j+1])+'</dd>').join('');
  const answered = dxCase.picked !== null, ok = dxCase.picked === dxCase.i;
  const bot = (html, ghost) => '<div class="msg"><span class="bot-ava'+(ghost?' ghost':'')+'">'+SPARK+'</span><div class="bubble">'+html+'</div></div>';
  let tail;

      + bot('<h4>Главный признак</h4><p>'+esc(row[row.length-1][0].toUpperCase()+row[row.length-1].slice(1))+'.</p>', true);

    <div class="fake${answered ? ' on' : ''}">${answered ? 'Следующий случай' : 'Выбери диагноз выше'}</div>
    <button class="sq" data-act="dx-next" aria-label="Следующий случай"${answered ? '' : ' disabled style="opacity:.5"'}>${I('arrow')}</button>
  </div>`;

/* ---------- Карточка билета ---------- */
function startStudy(list, startAt){
  if (!list.length) return;
  let q = list.slice();
  if (startAt){ const i = q.indexOf(startAt); if (i > 0) q = q.slice(i).concat(q.slice(0,i)); }
  session = {queue:q, i:0, flipped:false, know:0, again:0};
  renderStudy();
}
function ctl(act, icon, label, main, ghost){ return '<button class="ctl'+(main?' main':'')+(ghost?' ghost':'')+'" data-act="'+act+'"'+(ghost?' tabindex="-1" aria-hidden="true"':'')+'><span class="c">'+icon+'</span>'+label+'</button>'; }
function renderStudy(){
  const el = $('#study');
  if (!session){ el.hidden = true; document.body.classList.remove('lock'); return; }
  el.hidden = false; document.body.classList.add('lock');
  if (session.done){
    el.innerHTML = '<div class="study-in"><header class="topbar center"><button class="round" data-act="close-study" aria-label="Закрыть">'+I('back')+'</button><h2 class="bar-title">Готово</h2><span></span></header>'
      + medalHTML(I('check'), 'var(--good-tint)', 1) + '<h2 class="q">Знаю: '+session.know+' <span class="soft">· повторить: '+session.again+'</span></h2>'
      + '<p class="listen muted">Карточки с ответом «Знаю» сами вернутся на экран «Сегодня», когда придёт время их повторить.</p>'
      + '<div class="controls">'+ctl('close-study', I('check'), 'Вернуться', true)+'</div></div>';
    return;
  }
  const n = session.queue[session.i], t = T[n], sec = SECTIONS[t[0]-1];
  const pct = Math.round(session.i / session.queue.length * 100);
  let body, controls;
  if (!session.flipped){
    body = medalHTML('<span class="medal-cap" style="color:var(--s'+t[0]+'i)">Билет</span><span class="medal-num">'+n+'</span>', 'var(--s'+t[0]+')', (session.i+1)/session.queue.length)
      + '<p class="listen muted">Сначала вспомни ответ сама…</p><h2 class="q"><span class="soft">'+esc(sec.name)+'.</span> '+esc(t[1])+'</h2>';
    controls = ctl('close-study', I('x'), 'Выйти') + ctl('flip', I('eye'), 'Показать', true) + ctl('flip', I('x'), '', false, true);
  } else {
    body = '<h2 class="q sm"><span class="soft">Билет '+n+'.</span> '+esc(t[1])+'</h2>'
      + '<article class="card answer"><div class="label"><span class="dot" style="background:var(--s'+t[0]+'i)"></span>'+esc(sec.name)+'</div><ul>'+t[2].map(p => '<li>'+point(p)+'</li>').join('')+'</ul></article>';
    controls = ctl('again', I('reset'), 'Повторить') + ctl('know', I('check'), 'Знаю', true) + ctl('close-study', I('x'), 'Выйти');
  }
  el.innerHTML = '<div class="study-in">'
    + '<header class="topbar center"><button class="round" data-act="close-study" aria-label="Закрыть">'+I('back')+'</button><h2 class="bar-title">Билет '+n+'</h2><a class="round" href="'+DOC_URL+'" target="_blank" rel="noopener" aria-label="Открыть методичку">'+I('book')+'</a></header>'
    + '<div class="muted small center">Карточка '+(session.i+1)+' из '+session.queue.length+'</div>'
    + body + '<div class="controls">'+controls+'</div></div>';
}
function answer(ok){
  const n = session.queue[session.i];
  grade(n, ok);
  if (ok) session.know++;
  else { session.again++; if (!session.queue.slice(session.i+1).includes(n)) session.queue.push(n); }
  session.i++; session.flipped = false;
  if (session.i >= session.queue.length) session.done = true;
  markActive(); commit(); renderStudy();
  $('#study').scrollTop = 0;
}

/* ---------- Меню и отрисовка ---------- */
function renderTabbar(){
  const tb = (id, icon, label) => '<button class="tab" data-act="go" data-tab="'+id+'" aria-label="'+label+'" title="'+label+'"'+(tab===id?' aria-current="page"':'')+'>'+I(icon)+'</button>';
  $('#tabbar').innerHTML = tb('today','home','Сегодня') + tb('tickets','cards','Билеты')
    + '<button class="fab" data-act="fab" aria-label="Учить задание на сегодня" title="Учить задание на сегодня">'+SPARK+'</button>'
    + tb('trainer','target','Тренажёр') + tb('progress','chart','Прогресс');
}
function render(){
  const views = {today:todayView, tickets:ticketsView, trainer:trainerView, progress:progressView};
  $('#main').innerHTML = views[tab]();
  renderTabbar();
  updateSyncLabel();
  if (session) renderStudy();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'go') go(el.dataset.tab);
  else if (act === 'fab'){ const info = dayInfo(today()), due = dueList(today()); if (info.tickets.length) startStudy(info.tickets); else if (due.length) startStudy(due); else go('tickets'); }
  else if (act === 'study-today') startStudy(dayInfo(today()).tickets);
  else if (act === 'study-today-at') startStudy(dayInfo(today()).tickets, Number(el.dataset.n));
  else if (act === 'study-due') startStudy(dueList(today()));
  else if (act === 'study-list') startStudy(filtered());
  else if (act === 'study-one') startStudy(filtered(), Number(el.dataset.n));
  else if (act === 'flip'){ session.flipped = true; renderStudy(); $('#study').scrollTop = 0; }
  else if (act === 'know') answer(true);
  else if (act === 'again') answer(false);
  else if (act === 'close-study'){ session = null; renderStudy(); render(); }
  else if (act === 'filter'){ secFilter = Number(el.dataset.sec); render(); }
  else if (act === 'dx-set'){ dxSet = el.dataset.set; dxCase = null; render(); }
  else if (act === 'dx-pick'){
    if (dxCase.picked !== null) return;
    const j = Number(el.dataset.i); dxCase.picked = j;
    const ok = j === dxCase.i, name = DX[dxSet].rows[dxCase.i][0];
    dxRun.total++; state.dx.total++;
    if (ok){ dxRun.ok++; state.dx.ok++; } else { state.dx.miss[name] = (state.dx.miss[name] || 0) + 1; }
    markActive(); commit(); render();
  }
  else if (act === 'dx-next'){ newCase(); render(); window.scrollTo(0,0); }
  else if (act === 'to-settings'){ const s = document.getElementById('settings'); if (s) s.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
  else if (act === 'toggle-install'){ showInstall = !showInstall; render(); }
  else if (act === 'reset-ask'){ resetAsk = true; render(); }
  else if (act === 'reset-no'){ resetAsk = false; render(); }
  else if (act === 'reset-yes'){ const exam = state.examDate, nm = state.name; state = defaultState(); state.examDate = exam; state.name = nm; resetAsk = false; commit(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  query = e.target.value;
  const tl = $('#tlist'); if (tl) tl.innerHTML = ticketTiles();
  const n = filtered().length;
  const c1 = $('#cnt'), c2 = $('#cta'); if (c1) c1.textContent = n; if (c2) c2.textContent = 'Учить карточки · ' + n;
});
document.addEventListener('change', e => {
  if (e.target.id === 'exam' && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){ state.examDate = e.target.value; commit(); render(); }
  if (e.target.id === 'name'){ state.name = e.target.value.trim().slice(0,30); commit(); render(); }
});
document.addEventListener('keydown', e => {
  if (!session) return;
  if (e.key === 'Escape'){ session = null; renderStudy(); render(); }
  else if (!session.done && !session.flipped && (e.key === ' ' || e.key === 'Enter') && e.target === document.body){ e.preventDefault(); session.flipped = true; renderStudy(); }
});

render();
connect();
// На отдельном сайте: работа без интернета (в claude.ai не используется)
if (!IN_CLAUDE && 'serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
